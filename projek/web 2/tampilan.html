<!DOCTYPE html>
<html>
<head>
    <title>Website dengan Frame</title>
</head>

<!-- Frame utama dibagi secara vertikal: header (atas), isi (tengah), footer (bawah) -->
<frameset rows="25%,75%,10%">
    <!-- Header -->
    <frame src="header.html" name="header" noresize scrolling="no">

    <!-- Bagian tengah dibagi lagi secara horizontal untuk menu dan konten -->
    <frameset cols="20%,80%">
    </frameset>

    <!-- Footer -->
    <frame src="footer.html" name="footer" noresize scrolling="no">
</frameset>
</html>
