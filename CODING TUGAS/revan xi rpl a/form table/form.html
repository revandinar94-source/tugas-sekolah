<!DOCTYPE html>
<html>
<head>
    <title>Belajar HTML - Membuat Form</title>
    <style>
        table {
            background-color: beige;
            color: rgb(17, 19, 19);
        }
        h1 {
            color: rgb(18, 21, 21);
        }
    </style>
</head>
<body>
<form action="prosesForm.php" method="GET">
<!-- letakkan field di sini -->
<fieldset>
<legend align="center"><h1>Formulir Pendaftaran Siswa Baru</h1></legend>
<table>

<tr>
    <td>Nama Calon Siswa</td>
    <td>:</td>
    <td><input type="name" name="nama" required/><br /></td>
</tr>

<tr>
    <td>Tempat/Tanggal Lahir</td>
    <td>:</td>
    <td><input type="name" name="tempatLahir"/> <input type="date" name="tanggal"/></td>
</tr>

<tr>
    <td>Agama</td>
    <td>:</td>
    <td><select name="agama">
        <option value="islam"> Islam</option>
        <option value="kristen"> Kristen</option>
        <option value="katolik"> Katolik</option>
        <option value="budha"> Budha</option>
        <option value="hindu"> Hindu</option>
        <option value="konghucu"> konghucu</option>
    </select></td>
</tr>

<tr>
    <td>Alamat</td>
    <td>:</td>
    <td><textarea name="komentar" rows="4" cols="50" ></textarea></td>
</tr>

<tr>
    <td>No Telp/HP</td>
    <td>:</td>
    <td><input type="number" name="number" /></td>
</tr>

<tr>
    <td>Jenis Kelamin</td>
    <td>:</td>
    <td><input type="radio" name="jenisKelamin" /> Pria
        <input type="radio" name="jenisKelamin" /> Wanita</td>
</tr>

<tr>
    <td>Hobi</td>
    <td>:</td>
    <td><input type="checkbox" name="hobi" /> Membaca
        <input type="checkbox" name="hobi" /> Menulis
        <input type="checkbox" name="hobi" /> Olahraga
    </td>
</tr>

<tr>
    <td>Pas Foto</td>
    <td>:</td>
    <td><input type="file" name="foto" /></td>
</tr>

<tr>
    <td><input style="background-color: rgb(127, 255, 165);" type="submit" name="submit" value="SUBMIT"/></td>
    <td></td>
    <td><input style="background-color: brown;" type="reset" name="reset" value="RESET"/></td>
</tr>

</table>
</fieldset>

</form>
</body>
</html>
