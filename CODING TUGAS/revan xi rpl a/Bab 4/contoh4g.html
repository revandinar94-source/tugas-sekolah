<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trapesium</title>
</head>
<body>
    <h2>Trapesium</h2>
    <script>
        let a = parseFloat(prompt("Masukan sisi atas:"));
        let b = parseFloat(prompt("Masukan sisi bawah:"));
        let t = parseFloat(prompt("Masukan tinggi:"));
        let c = parseFloat(prompt("Masukan sisi miring kiri:"));
        let d = parseFloat(prompt("Masukan sisi miring kanan:"));
        let luas = 0.5 * (a + b) * t;
        let keliling = a + b + c + d;
        document.write("Luas: " + luas + "<br>");
        document.write("Keliling: " + keliling);
    </script>
    
</body>
</html>
