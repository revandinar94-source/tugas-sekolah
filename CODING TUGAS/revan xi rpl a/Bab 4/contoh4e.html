<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lingkaran</title>
</head>
<body>
    <h2>Lingkaran</h2>
    <script>
        let r = parseFloat(prompt("Masukan jari-jari:"));
        let luas = Math.PI * r * r;
        let keliling = 2 * Math.PI * r;
        document.write("Luas: " + luas.toFixed(2) + "<br>");
        document.write("Keliling: " + keliling.toFixed(2));
    </script>
</body>
</html>
