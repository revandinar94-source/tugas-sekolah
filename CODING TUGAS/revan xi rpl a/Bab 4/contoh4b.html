<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>persegi panjang</title>
</head>
<body>
    <h1>Hitung Luas dan kelliling persegi panjang</h1>

    <script>
        let panjang = parseFloat(prompt("Masukan panjang:"));
        let lebar = parseFloat(prompt("masukan lebar:"));

        let luas = panjang * lebar;
        let kelliling = 2 * (panjang + lebar);

        document.write("panjang: " + panjang + "<br>");
        document.write("lebar:" + lebar + "<br>");
        document.write("luas persegi panjang: " + luas + "<br>");
        document.write("keliling persegi panjang: " + kelliling);
    </script>
    
</body>
</html>
