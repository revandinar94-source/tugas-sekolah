<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>persegi panjang</title>
</head>
<body>
    <h2>persegi panjang</h2>
    <script>
        let p = parseFloat(prompt("Masukan panjang:"));
        let l = parseFloat(prompt("Masukan lebar:"));
        let luas = p * l;
        let keliling = 2 * (p + l);
        document.write("Luas: " + luas + "<br>");
        document.write("Keliling: " + keliling);
    </script>
</body>
</html>
